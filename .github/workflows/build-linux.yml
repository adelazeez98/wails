name: Build Linux App
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Upgraded to v6 for native Node 24 execution
      - uses: actions/checkout@v6

      # Upgraded to v6 for native Node 24 execution
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21' 

      # Upgraded to v6 for native Node 24 execution
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '18' 

       Tar-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build

      # Already updated to v4 to fix the previous artifact deprecation
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/bin/*
